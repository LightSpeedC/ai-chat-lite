<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="5 つの経路がそれぞれ別の層で止まる図">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280, 78%, 25%)"/>
			<stop offset="1" stop-color="hsl(280, 58%, 55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0, 78%, 25%)"/>
			<stop offset="1" stop-color="hsl(0, 58%, 55%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140, 78%, 25%)"/>
			<stop offset="1" stop-color="hsl(140, 58%, 55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="12" y="22" font-size="13" fill="#4a5568">事故の経路</text>
	<text x="300" y="22" font-size="13" fill="#4a5568">止める層</text>
	<text x="600" y="22" font-size="13" fill="#4a5568">結果</text>

	<rect x="12" y="36" width="200" height="26" rx="5" fill="url(#i1)"/>
	<text x="24" y="54" font-size="12" fill="#fff">環境変数を忘れる</text>
	<rect x="12" y="68" width="200" height="26" rx="5" fill="url(#i1)"/>
	<text x="24" y="86" font-size="12" fill="#fff">サーバーを立て忘れる</text>
	<rect x="12" y="100" width="200" height="26" rx="5" fill="url(#i1)"/>
	<text x="24" y="118" font-size="12" fill="#fff">接続先を取り違える</text>
	<rect x="12" y="132" width="200" height="26" rx="5" fill="url(#i1)"/>
	<text x="24" y="150" font-size="12" fill="#fff">他プロジェクトが繋ぐ</text>
	<rect x="12" y="164" width="200" height="26" rx="5" fill="url(#i1)"/>
	<text x="24" y="182" font-size="12" fill="#fff">人が画面で取り違える</text>

	<rect x="272" y="36" width="230" height="26" rx="5" fill="url(#i3)"/>
	<text x="284" y="54" font-size="12" fill="#fff">既定がテスト DB（2 章）</text>
	<rect x="272" y="68" width="230" height="26" rx="5" fill="url(#i3)"/>
	<text x="284" y="86" font-size="12" fill="#fff">繋がずに止まる（2 章）</text>
	<rect x="272" y="100" width="230" height="26" rx="5" fill="url(#i3)"/>
	<text x="284" y="118" font-size="12" fill="#fff">環境を確かめる（3 章）</text>
	<rect x="272" y="132" width="230" height="26" rx="5" fill="url(#i3)"/>
	<text x="284" y="150" font-size="12" fill="#fff">トークンを要る（5 章）</text>
	<rect x="272" y="164" width="230" height="26" rx="5" fill="url(#i3)"/>
	<text x="284" y="182" font-size="12" fill="#fff">色が違う（4 章）</text>

	<g stroke="#97a1ae" stroke-width="1.5" fill="none">
		<path d="M212 49 L268 49"/><path d="M212 81 L268 81"/><path d="M212 113 L268 113"/>
		<path d="M212 145 L268 145"/><path d="M212 177 L268 177"/>
		<path d="M502 49 L558 49"/><path d="M502 81 L558 81"/><path d="M502 113 L558 113"/>
		<path d="M502 145 L558 145"/><path d="M502 177 L558 177"/>
	</g>

	<rect x="562" y="80" width="146" height="66" rx="6" fill="url(#i2)"/>
	<text x="584" y="106" font-size="13" fill="#fff">本番に届かない</text>
	<text x="596" y="128" font-size="11" fill="#fff">（手前で止まる）</text>
</svg>
