<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="ブラウザ起動時のシーケンス">
			<defs>
				<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(280, 78%, 25%)"/><stop offset="1" stop-color="hsl(280, 58%, 55%)"/>
				</linearGradient>
				<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(200, 78%, 25%)"/><stop offset="1" stop-color="hsl(200, 58%, 55%)"/>
				</linearGradient>
				<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(120, 78%, 25%)"/><stop offset="1" stop-color="hsl(120, 58%, 55%)"/>
				</linearGradient>
				<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(40, 78%, 25%)"/><stop offset="1" stop-color="hsl(40, 58%, 55%)"/>
				</linearGradient>
				<marker id="i5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
					<path d="M0,0 L9,4.5 L0,9 z" fill="#4a5568"/>
				</marker>
			</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

			<rect width="1000" height="470" fill="#ffffff"/>

			<rect x="40" y="24" width="380" height="66" rx="9" fill="url(#i1)"/>
			<text x="230" y="52" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif">① POST /api/join</text>
			<text x="230" y="74" text-anchor="middle" fill="#e9d8f5" font-size="13" font-family="sans-serif">user_id を申告する</text>

			<text x="460" y="48" fill="#1c2330" font-size="13" font-family="sans-serif">users を UPSERT する</text>
			<text x="460" y="70" fill="#1c2330" font-size="13" font-family="sans-serif">MAX(msg_seq) と参加者一覧が返る</text>

			<line x1="230" y1="90" x2="230" y2="126" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i5)"/>

			<rect x="40" y="130" width="380" height="66" rx="9" fill="url(#i2)"/>
			<text x="230" y="158" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif">② GET /api/history?limit=50</text>
			<text x="230" y="180" text-anchor="middle" fill="#d5e8f5" font-size="13" font-family="sans-serif">直近 50 件を取る</text>

			<text x="460" y="154" fill="#1c2330" font-size="13" font-family="sans-serif">ORDER BY msg_seq DESC LIMIT 50</text>
			<text x="460" y="176" fill="#1c2330" font-size="13" font-family="sans-serif">受け取ってから昇順に直して並べる</text>

			<line x1="230" y1="196" x2="230" y2="266" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i5)"/>

			<rect x="255" y="212" width="18" height="18" rx="4" fill="#a51f22"/>
			<text x="285" y="226" fill="#a51f22" font-size="13" font-family="sans-serif">この隙間に届いたメッセージは、③ の since で埋まる</text>

			<rect x="40" y="270" width="380" height="66" rx="9" fill="url(#i3)"/>
			<text x="230" y="298" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif">③ GET /api/events?since=…</text>
			<text x="230" y="320" text-anchor="middle" fill="#d8f0dd" font-size="13" font-family="sans-serif">SSE を繋ぐ</text>

			<text x="460" y="294" fill="#1c2330" font-size="13" font-family="sans-serif">since より新しい行をまず流す</text>
			<text x="460" y="316" fill="#1c2330" font-size="13" font-family="sans-serif">active_connection_count を +1 する</text>

			<line x1="230" y1="336" x2="230" y2="372" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i5)"/>

			<rect x="40" y="376" width="380" height="66" rx="9" fill="url(#i4)"/>
			<text x="230" y="404" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif">④ 以降はサーバーから push</text>
			<text x="230" y="426" text-anchor="middle" fill="#fbeeda" font-size="13" font-family="sans-serif">待たずに受け取る</text>

			<text x="460" y="400" fill="#1c2330" font-size="13" font-family="sans-serif">新着メッセージと入退室が届く</text>
			<text x="460" y="422" fill="#1c2330" font-size="13" font-family="sans-serif">切断したら ③ から繋ぎ直す</text>
		</svg>
