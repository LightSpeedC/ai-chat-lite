			<rect x="140" y="134" width="403.7" height="26" rx="3" fill="url(#i3)"/>
			<rect x="140" y="178" width="457.6" height="26" rx="3" fill="url(#i4)"/>
			<g font-size="13" fill="#1c2330" font-weight="700">
				<text x="203.7" y="64">63</text>
