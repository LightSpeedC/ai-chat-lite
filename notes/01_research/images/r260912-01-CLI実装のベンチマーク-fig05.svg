<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="ビルドと文法チェックにかかる時間の比較">
			<defs>
				<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
				<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
				<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/></linearGradient>
				<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
			</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
			<rect width="100%" height="100%" fill="#ffffff"/>
			<text x="10" y="22" font-size="14" font-weight="700" fill="#1c2330">直してから確かめられるまで（中央値 ms・小さいほど良い）</text>
			<g stroke="#d9dfe8" stroke-width="1">
				<line x1="140" y1="36" x2="140" y2="204"/>
				<line x1="272.5" y1="36" x2="272.5" y2="204"/>
				<line x1="405" y1="36" x2="405" y2="204"/>
				<line x1="537.5" y1="36" x2="537.5" y2="204"/>
				<line x1="670" y1="36" x2="670" y2="204"/>
			</g>
			<g font-size="12" fill="#4a5568" text-anchor="middle">
				<text x="140" y="224">0</text><text x="272.5" y="224">150</text><text x="405" y="224">300</text><text x="537.5" y="224">450</text><text x="670" y="224">600</text>
			</g>
			<g font-size="13" fill="#1c2330" text-anchor="end" font-weight="700">
