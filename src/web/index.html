<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-chat-lite</title>
<link rel="stylesheet" href="css/chat.css">
</head>
<body>

<header class="titlebar">
	<div class="titlebar-main">
		<h1>ai-chat-lite</h1>
		<!-- テスト用に繋いだときだけ出す。色だけに頼らず文字でも示す -->
		<span class="env-badge" id="env-badge" hidden>テスト環境</span>
		<select class="room" id="room-select" title="ルームを選ぶ"></select>
		<button type="button" id="new-room" title="ルームを作る">＋</button>
	</div>
	<div class="titlebar-me">
		<span class="version" id="version" title="サーバーの版。起動した時刻">—</span>
		<span id="me-label">—</span>
		<button type="button" id="change-id">ID を変える</button>
	</div>
</header>

<div class="layout">

	<aside class="connectors">
		<h2>参加者 <span class="count" id="connector-count">0</span></h2>
		<ul id="connector-list"></ul>
		<p class="legend">
			<span class="mark online"></span>接続中
			<span class="mark grace"></span>一時切断
			<span class="mark offline"></span>オフライン
		</p>
	</aside>

	<main class="messages">
		<div class="log" id="log">
			<p class="more" id="more"><button type="button" id="load-more">前を読み込む</button></p>
			<div id="items"></div>
		</div>

		<form class="composer" id="composer">
			<textarea id="input" rows="2" placeholder="本文を入力（Ctrl+Enter で送信）。Markdown が使えます"></textarea>
			<div class="composer-side">
				<label class="to">
					宛先
					<input type="text" id="to" list="connector-ids" placeholder="全員" size="12">
				</label>
				<button type="submit" id="send">送信</button>
			</div>
		</form>
		<datalist id="connector-ids"></datalist>
	</main>

</div>

<div class="banner" id="banner" hidden></div>

<dialog id="id-dialog">
	<form method="dialog">
		<h2>名乗る ID</h2>
		<p>この画面で使う名前を入力してください。次からは覚えています。</p>
		<input type="text" id="id-input" maxlength="64" required>
		<menu>
			<button value="ok">決定</button>
		</menu>
	</form>
</dialog>

<dialog id="room-dialog">
	<form method="dialog">
		<h2>新しいルーム</h2>
		<p>ルーム名を入れてください。最初の発言があった時点で一覧に並びます。</p>
		<input type="text" id="room-input" maxlength="64" required>
		<menu>
			<button value="cancel" formnovalue>やめる</button>
			<button value="ok">決定</button>
		</menu>
	</form>
</dialog>

<script type="module" src="js/chat.js"></script>

</body>
</html>
